name: Android APK

# Builds the Android app from source on a Windows runner (the host the console build uses too: the code generator needs
# a PC, and Renut's shader toolchain is a Windows host tool).
#
# You supply your own copy of the game as a link, per run - nothing of it is committed, and nothing of it ends up in the
# APK: the launcher imports the game on the device, and the APK only carries the program.
#
#   game_data_url  an archive (zip/7z/tar.gz) with the extracted game (default.xex, data/, data-360/, ArcadeInfo.xml),
#                  or a direct URL to default.xex
#   shaders_url    optional:
#                    - shader_cache_switch.cpp + spirv_cache.zst from a PC build: the complete set, ~30 minutes faster;
#                    - ps_*.bin / vs_*.bin captured on a phone (Settings > Export the captures): merged into the dump,
#                      which is the only way to get the shaders the game compiles at run time without a PC;
#                    - the game's shader files (data-360/bootstrap/shaders/*.fxc);
#                    - empty: the cache is made here from the game data alone.
#
# Read docs/android.md for the whole chain and for the "no PC" loop.

on:
  workflow_dispatch:
    inputs:
      game_data_url:
        description: 'Link to your game data: archive of the extracted game, or default.xex itself'
        required: true
        type: string
      shaders_url:
        description: 'Optional: your shader cache, shaders captured on a phone, or the game shader files. Empty = make the cache here'
        required: false
        default: ''
        type: string
      variant:
        description: 'APK variant (release is signed with a throwaway debug key so it installs)'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      sdl3_ref:
        description: 'SDL3 tag to clone when the SDK tree has no SDL3 (only used then)'
        required: false
        default: release-3.4.18
        type: string
      ndk_version:
        description: 'Android NDK version'
        required: false
        default: '26.3.11579264'
        type: string
      etc2:
        description: 'Transcode the game DXT textures to ETC2/EAC on upload (see docs/android.md)'
        required: true
        default: 'on'
        type: choice
        options:
          - 'on'
          - 'off'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  SHANK1_NDK: ${{ inputs.ndk_version }}
  SHANK1_ETC2: ${{ inputs.etc2 }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  apk:
    name: Build the APK
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          submodules: false

      # The recompiled game's C++ (about 100 MB, ~22,000 functions) depends only on the manifest and the overrides, so
      # it is cached: a rerun that does not touch them skips the expensive step.
      - name: Restore the generated code
        uses: actions/cache@v4
        with:
          path: port/generated
          key: codegen-${{ hashFiles('port/shank1_manifest.toml', 'port/overrides.toml') }}

      - name: Toolchain paths
        run: |
          Add-Content $env:GITHUB_PATH (Join-Path (Join-Path $env:ProgramFiles 'CMake') 'bin')
          Add-Content $env:GITHUB_PATH (Join-Path (Join-Path $env:ProgramFiles 'LLVM') 'bin')
          python -m pip install --disable-pip-version-check --quiet xxhash pillow
          cmake --version | Select-Object -First 1
          clang --version | Select-Object -First 1
          python --version

      - name: Download the game data
        run: |
          $ErrorActionPreference = 'Stop'
          $url = '${{ inputs.game_data_url }}'
          $temp = Join-Path $env:RUNNER_TEMP 'game-data'
          New-Item -ItemType Directory -Force $temp | Out-Null
          $file = Join-Path $temp 'download.bin'
          Write-Host 'downloading the game data'
          Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 10
          if ($file.Length -lt 1MB) { throw "the download is empty ($($file.Length) bytes): check the link" }
          $head = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8, 200)
          if ($head -match '(?i)<!doctype html|<html') {
            throw 'the link returned a web page, not a file: use a direct download link (one that starts the download)'
          }

          $raw = Join-Path $temp 'raw'
          New-Item -ItemType Directory -Force $raw | Out-Null
          $extension = [System.IO.Path]::GetExtension(($url.Split('?')[0])).ToLower()
          $sevenZip = Join-Path (Join-Path $env:ProgramFiles '7-Zip') '7z.exe'
          if ($extension -eq '.xex') {
            Copy-Item $file (Join-Path $raw 'default.xex')
          } elseif ($extension -eq '.zip') {
            Expand-Archive -Path $file -DestinationPath $raw -Force
          } elseif (Test-Path $sevenZip) {
            & $sevenZip x -y "-o$raw" $file | Select-Object -Last 3
            if ($LASTEXITCODE -ne 0) { throw '7-Zip could not extract the game data' }
          } else {
            & tar -xf $file -C $raw
            if ($LASTEXITCODE -ne 0) { throw 'could not extract the game data (zip, 7z and tar were refused)' }
          }

          $xex = Get-ChildItem $raw -Recurse -Filter default.xex -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $xex) { throw 'no default.xex in the archive: it must be the extracted game, not the package file' }
          Write-Host "found $($xex.FullName) ($([math]::Round($xex.Length / 1MB, 1)) MB)"

          # docs/building.md step 2: the extracted game goes to extracted/ next to port/.
          $extracted = Join-Path $env:GITHUB_WORKSPACE 'extracted'
          New-Item -ItemType Directory -Force $extracted | Out-Null
          Copy-Item (Join-Path $xex.DirectoryName '*') $extracted -Recurse -Force
          "SHANK1_EXTRACTED=$extracted" | Out-File -FilePath $env:GITHUB_ENV -Append
          $count = (Get-ChildItem $extracted -Recurse -File).Count
          $size = [math]::Round(((Get-ChildItem $extracted -Recurse -File | Measure-Object Length -Sum).Sum / 1GB), 2)
          Write-Host "game data in place: $count files, $size GB"

      - name: Download the shaders
        id: shaders
        env:
          SHADERS_URL: ${{ inputs.shaders_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:SHADERS_URL
          $temp = Join-Path $env:RUNNER_TEMP 'shaders'
          $raw = Join-Path $temp 'raw'
          New-Item -ItemType Directory -Force $raw | Out-Null

          if (-not $url -or $url.Trim() -eq '') {
            Write-Host 'no shaders link: the cache will be made here from the game data'
          } else {
            $file = Join-Path $temp 'download.bin'
            Write-Host 'downloading the shaders'
            Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 10
            if ($file.Length -lt 4KB) { throw "the download is too small ($($file.Length) bytes): check the link" }
            $head = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8, 200)
            if ($head -match '(?i)<!doctype html|<html') {
              throw 'the link returned a web page, not a file: use a direct download link (one that starts the download)'
            }
            $extension = [System.IO.Path]::GetExtension(($url.Split('?')[0])).ToLower()
            $sevenZip = Join-Path (Join-Path $env:ProgramFiles '7-Zip') '7z.exe'
            if ($extension -eq '.zip') {
              Expand-Archive -Path $file -DestinationPath $raw -Force
            } elseif ($extension -in @('.fxc', '.cpp', '.zst', '.bin')) {
              Copy-Item $file (Join-Path $raw 'download')
            } elseif (Test-Path $sevenZip) {
              & $sevenZip x -y "-o$raw" $file | Select-Object -Last 3
              if ($LASTEXITCODE -ne 0) { throw '7-Zip could not extract the shaders' }
            } else {
              & tar -xf $file -C $raw
              if ($LASTEXITCODE -ne 0) { throw 'could not extract the shaders (zip, 7z and tar were refused)' }
            }
          }

          # A ready cache wins: it is the complete set and skips the PC build.
          $cache = Get-ChildItem $raw -Recurse -Filter 'shader_cache_switch.cpp' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($cache) {
            $blob = Get-ChildItem $raw -Recurse -Filter 'spirv_cache.zst' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $blob) {
              throw 'shader_cache_switch.cpp needs spirv_cache.zst (the .cpp embeds it with .incbin): include both'
            }
            $dir = Join-Path $env:GITHUB_WORKSPACE 'shader-cache'
            New-Item -ItemType Directory -Force $dir | Out-Null
            $cpp = Join-Path $dir 'shader_cache_switch.cpp'
            $zst = Join-Path $dir 'spirv_cache.zst'
            Copy-Item $cache.FullName $cpp -Force
            Copy-Item $blob.FullName $zst -Force

            # The .cpp was generated on another machine, with an absolute .incbin path: point it at this checkout. The
            # path is spelled the way the generator spells it - forward slashes - so the assembler finds the blob.
            $slash = [string][char]47
            $target = $zst -replace [regex]::Escape([string][char]92), $slash
            $quoted = [string][char]92 + '"'
            $text = Get-Content -Raw $cpp
            $marker = $text.IndexOf('.incbin')
            if ($marker -lt 0) { throw 'shader_cache_switch.cpp has no .incbin line: is it the right file?' }
            $first = $text.IndexOf($quoted, $marker) + $quoted.Length
            $second = $text.IndexOf($quoted, $first)
            if ($first -lt $quoted.Length -or $second -lt $first) { throw 'shader_cache_switch.cpp: the .incbin line is not as expected' }
            $patched = $text.Substring(0, $first) + $target + $text.Substring($second)
            Set-Content -Path $cpp -Value $patched -NoNewline -Encoding utf8
            Write-Host "shader cache supplied: $([math]::Round((Get-Item $cpp).Length / 1KB, 0)) KB of source + $([math]::Round((Get-Item $zst).Length / 1KB, 0)) KB of SPIR-V"
            'mode=cache' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "cpp=$cpp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          # Shaders a phone captured while playing (Settings > Export the captures): merged into the dump, which is
          # the only way to get the shaders the game compiles at run time without a PC.
          $captures = @(Get-ChildItem $raw -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq '.bin' -and $_.BaseName -match '^(ps|vs)_[0-9a-fA-F]{16}$' })
          if ($captures.Count -gt 0) {
            $dir = Join-Path $env:GITHUB_WORKSPACE 'captured-shaders'
            New-Item -ItemType Directory -Force $dir | Out-Null
            $captures | ForEach-Object { Copy-Item $_.FullName $dir -Force }
            Write-Host "shaders captured on a device: $($captures.Count)"
            "captures=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          $fxc = Get-ChildItem $raw -Recurse -Filter '*.fxc' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($fxc) {
            Write-Host "shader files: $($fxc.DirectoryName) goes into the dump too"
            "extra=$($fxc.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          'mode=dump' | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare the tree (SDK submodule, patch, thirdparty, DXC)
        run: pwsh -File tools/setup.ps1

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build the code generator
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location tools/sa2-nx/sdk
          try {
            cmake --preset win-amd64
            cmake --build out/win-amd64 --config Release --target rexglue --parallel
          } finally { Pop-Location }
          if (-not (Test-Path 'tools/sa2-nx/sdk/out/win-amd64/Release/rexglue.exe')) {
            throw 'rexglue.exe was not built'
          }

      - name: Generate the game's C++
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location port
          try {
            if (Test-Path 'generated/default') {
              Write-Host 'using the cached generated code'
            } else {
              & ../tools/sa2-nx/sdk/out/win-amd64/Release/rexglue.exe codegen shank1_manifest.toml --ignore-stamp
              if ($LASTEXITCODE -ne 0) { throw 'codegen failed' }
            }
          } finally { Pop-Location }
          $files = (Get-ChildItem port/generated -Recurse -File).Count
          $size = [math]::Round(((Get-ChildItem port/generated -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 0)
          Write-Host "generated: $files files, $size MB"

      # Only when no cache was supplied: dump the shaders from the game, merge whatever the shaders link had, build the
      # PC tree (which translates them with XenosRecomp and writes renut_gpu/shader_cache.cpp), keep the SPIR-V half.
      - name: Shader dump
        if: steps.shaders.outputs.mode == 'dump'
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location port
          try {
            python tools/shank1_dump_shaders.py --game "$env:SHANK1_EXTRACTED" --out out/renut_shader_dump
            if ($LASTEXITCODE -ne 0) { throw 'the shader dump failed (does the game data have data-360/bootstrap/shaders?)' }
            $dump = Join-Path $PWD 'out/renut_shader_dump'

            # The dump is what the translator reads, so everything else goes in it
            # (port/cmake/collect_captured_shaders.cmake does the same for a build directory).
            foreach ($extra in @('${{ steps.shaders.outputs.extra }}', '${{ steps.shaders.outputs.captures }}')) {
              if ($extra -and (Test-Path $extra)) {
                Get-ChildItem $extra -File | ForEach-Object {
                  $target = Join-Path $dump $_.Name
                  if (-not (Test-Path $target)) { Copy-Item $_.FullName $target }
                }
              }
            }
            $count = (Get-ChildItem $dump -Recurse -File).Count
            Write-Host "dump: $count containers"
          } finally { Pop-Location }

      - name: PC build for the shader cache
        id: shadercache
        if: steps.shaders.outputs.mode == 'dump'
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location port
          try {
            cmake --preset win-amd64-release -DSHANK1_RENUT_RENDERER=ON
            if ($LASTEXITCODE -ne 0) { throw 'the PC configure failed' }
            cmake --build --preset win-amd64-release --parallel
            if ($LASTEXITCODE -ne 0) { throw 'the PC build failed' }
            python tools/renut_switch_shader_cache.py --pc out/build/win-amd64-release
            if ($LASTEXITCODE -ne 0) { throw 'the shader cache was not made' }
          } finally { Pop-Location }
          "cpp=$env:GITHUB_WORKSPACE/port/out/renut_switch/shader_cache_switch.cpp" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Find SDL3
        id: sdl3
        run: |
          $ErrorActionPreference = 'Stop'
          $activity = Get-ChildItem -Path . -Recurse -Filter SDLActivity.java -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $activity) {
            Write-Host "no SDL3 in the tree: cloning ${{ inputs.sdl3_ref }}"
            git clone --depth 1 --branch '${{ inputs.sdl3_ref }}' https://github.com/libsdl-org/SDL thirdparty/sdl3
            if ($LASTEXITCODE -ne 0) { throw 'could not clone SDL3 (pass a valid sdl3_ref, e.g. release-3.4.18)' }
            $activity = Get-ChildItem -Path thirdparty/sdl3 -Recurse -Filter SDLActivity.java | Select-Object -First 1
          }
          if (-not $activity) { throw 'SDLActivity.java not found after cloning SDL3' }

          # <SDL>/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java
          $java = $activity.Directory.Parent.Parent.Parent
          if (-not (Test-Path (Join-Path (Join-Path $java 'org/libsdl/app') 'SDLActivity.java'))) {
            throw "$($activity.FullName) is not SDL3's android-project layout"
          }
          $sdl = $java.Parent.Parent.Parent.Parent.Parent
          Write-Host "SDL3: $sdl"
          "java=$($java.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dir=$($sdl.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the NDK
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkmanager = Join-Path (Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin') 'sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) { throw "sdkmanager not found at $sdkmanager" }
          Write-Host "installing NDK $env:SHANK1_NDK"
          ('y' * 20) | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;$env:SHANK1_NDK" 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'the NDK install failed' }
          $ndk = Join-Path (Join-Path $env:ANDROID_HOME 'ndk') $env:SHANK1_NDK
          if (-not (Test-Path $ndk)) { throw "NDK $env:SHANK1_NDK is not in $env:ANDROID_HOME" }

          # AGP wants a CMake of at least 3.25 for this project; the runner's is newer than anything the SDK ships.
          $cmakeDir = Split-Path (Split-Path (Get-Command cmake).Source)
          $cmakeVersion = (cmake --version | Select-Object -First 1).ToString().Trim()
          if ($cmakeVersion.StartsWith('cmake version ')) { $cmakeVersion = $cmakeVersion.Substring(14) }
          Write-Host "CMake $cmakeVersion at $cmakeDir"

          # local.properties is a Java properties file: the separators are escaped there.
          $bs = [string][char]92
          $escaped = $cmakeDir.Replace($bs, $bs + $bs).Replace(':', $bs + ':')
          $sdkEscaped = $env:ANDROID_HOME.Replace($bs, $bs + $bs).Replace(':', $bs + ':')
          $local = Join-Path $env:GITHUB_WORKSPACE 'android/local.properties'
          Set-Content -Path $local -Value @("sdk.dir=$sdkEscaped", "cmake.dir=$escaped") -Encoding ascii
          "SHANK1_CMAKE_VERSION=$cmakeVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location android
          try {
            if (-not (Test-Path 'gradlew.bat')) {
              Write-Host 'no wrapper in the repository: making one'
              gradle wrapper --gradle-version 8.7
              if ($LASTEXITCODE -ne 0) { throw 'gradle wrapper failed (is Gradle on PATH?)' }
            }

            $variant = '${{ inputs.variant }}'
            $task = if ($variant -eq 'release') { 'assembleRelease' } else { 'assembleDebug' }
            $arguments = @(
              '--stacktrace',
              $task,
              "-Pshank1.sdl3Java=${{ steps.sdl3.outputs.java }}",
              "-Pshank1.sdl3Dir=${{ steps.sdl3.outputs.dir }}",
              "-Pshank1.shaderCache=${{ steps.shaders.outputs.cpp || steps.shadercache.outputs.cpp }}",
              "-Pshank1.cmakeVersion=$env:SHANK1_CMAKE_VERSION",
              '-Pshank1.buildType=Release',
              "-Pshank1.etc2=$env:SHANK1_ETC2",
              "-Pshank1.ndkVersion=$env:SHANK1_NDK"
            )

            if ($variant -eq 'release') {
              # A release APK is not signed by default: sign it with a throwaway debug key so it installs as is.
              # Replace it with your own key for anything you keep.
              $androidHome = Join-Path $env:USERPROFILE '.android'
              $keystore = Join-Path $androidHome 'debug.keystore'
              if (-not (Test-Path $keystore)) {
                New-Item -ItemType Directory -Force $androidHome | Out-Null
                & keytool -genkeypair -keystore $keystore -storepass android -alias androiddebugkey -keypass android `
                  -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
                if ($LASTEXITCODE -ne 0) { throw 'could not make a keystore' }
              }
              $arguments += @(
                "-Pandroid.injected.signing.store.file=$keystore",
                '-Pandroid.injected.signing.store.password=android',
                '-Pandroid.injected.signing.key.alias=androiddebugkey',
                '-Pandroid.injected.signing.key.password=android'
              )
            }

            Write-Host "gradlew $($arguments -join ' ')"
            & ./gradlew.bat @arguments
            if ($LASTEXITCODE -ne 0) { throw 'the Gradle build failed' }
          } finally { Pop-Location }

      - name: Collect the APK
        run: |
          $apks = Get-ChildItem android/app/build/outputs/apk -Recurse -Filter '*.apk' -ErrorAction SilentlyContinue
          if (-not $apks) { throw 'no APK was produced' }
          foreach ($candidate in $apks) {
            Write-Host "$($candidate.FullName) - $([math]::Round($candidate.Length / 1MB, 1)) MB"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $apk = $apks | Where-Object { $_.Name -notmatch 'unsigned' } | Select-Object -First 1
          if (-not $apk) { $apk = $apks | Select-Object -First 1 }
          $name = "shank1-${{ inputs.variant }}-${{ github.run_number }}.apk"
          Copy-Item $apk.FullName (Join-Path dist $name) -Force
          Write-Host "artifact: dist/$name"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: shank1-android-${{ inputs.variant }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          @"
          ### Android APK

          | | |
          | --- | --- |
          | Variant | `${{ inputs.variant }}` |
          | Shaders | $(if ('${{ steps.shaders.outputs.mode }}' -eq 'cache') { 'supplied cache (full set)' } else { 'made here from the game files' }) |
          | Captures merged | $(if ('${{ steps.shaders.outputs.captures }}' -eq '') { 'none' } else { 'yes - the shaders a phone compiled' }) |
          | ETC2 | `$env:SHANK1_ETC2` |
          | NDK | `$env:SHANK1_NDK` |

          The APK contains the program only. Install it on the phone, then **Import game data** in the launcher and pick
          the folder with `default.xex` - the game's files never leave your device.

          Missing effects? The game compiles some shaders while it runs, so a build made from its files alone lacks
          them: play once, then **Settings > Export the captures** in the app, and pass that archive as `shaders_url`
          to a second run. `docs/android.md` has the details.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
