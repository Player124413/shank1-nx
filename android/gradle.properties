# Gradle settings for the Android port. Pass -Pshank1.sdl3Java=<SDL3>/android-project/app/src/main/java (or set
# SHANK1_SDL3_JAVA) to have the build copy SDL's Java classes into app/src/main/java/org/libsdl/app, which is where
# GameActivity finds SDLActivity. They are SDL's files (zlib licence) and are not kept in this repository.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# The native build (port/CMakeLists.txt): a Release build is what the release APK uses; -Pshank1.buildType=Debug makes
# an unoptimised library for a debugger session.
shank1.buildType=Release

# Which ABIs to build: arm64-v8a is the only one a phone needs; add x86_64 for the emulator (slow: the game is a
# recompiled PowerPC title and the emulator's translation of our ARM code on top of that is not worth it).
shank1.abis=arm64-v8a
