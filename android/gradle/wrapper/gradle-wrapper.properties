# Gradle 8.7 is what Android Studio Iguana+ and AGP 8.5 want. The wrapper's jar and scripts are not committed (a
# binary and two generated shell scripts): run `gradle wrapper --gradle-version 8.7` once in this folder, or open the
# project in Android Studio, which adds them.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
